[project]
name = "imvar-cli"
version = "0.1.0"
description = "CLI for building base images for variants of development containers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
imvar-cli = "imvar.entrypoint:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imvar"]

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
line_length = 90

[tool.ruff]
target-version = "py312"
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=imvar --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
