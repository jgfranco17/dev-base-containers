[project]
name = "dev-base-containers"
version = "0.1.0"
description = "Base images for development containers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
line_length = 90

[tool.ruff]
target-version = "py312"
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
