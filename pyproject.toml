[project]
name = "dev-base-containers"
version = "0.1.0"
description = "Base images for development containers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
line_length = 90

[tool.ruff]
target-version = "py312"
line-length = 90
